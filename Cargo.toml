[workspace]
resolver = "2"
members = [
    "examples/security-flasher",
    "examples/security-flasher-sdk",
    "examples/security-flasher-plugins/examplecar-fileloader",
    "examples/security-flasher-plugins/examplecar-flow",
    "examples/security-flasher-plugins/examplecar-seedkey",
    "crates/autors-util",
    "crates/autors-native",
    "crates/autors-runtime",
    "crates/autors-a2l",
    "crates/autors-formula",
    "crates/autors-values",
    "crates/autors-cdf",
    "crates/autors-dcm",
    "crates/autors-datafile",
    "crates/autors-dbc",
    "crates/autors-ldf",
    "crates/autors-asc",
    "crates/autors-blf",
    "crates/autors-ltrc",
    "crates/autors-isotp",
    "crates/autors-odx",
    "crates/autors-prm",
    "crates/autors-diag",
    "crates/autors-mdf",
    "crates/autors-symbols",
    "crates/autors-elf",
    "crates/autors-map",
    "crates/autors-comm",
    "crates/autors-ccp",
    "crates/autors-xcp",
    "crates/autors-lin",
    "crates/autors-can",
    "crates/autors-scheduler",
    "crates/autors-cli",
    "crates/autors-ffi",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
publish = true

[workspace.dependencies]
autors-util = { version = "0.1.0", path = "crates/autors-util" }
autors-native = { version = "0.1.0", path = "crates/autors-native" }
autors-runtime = { version = "0.1.0", path = "crates/autors-runtime", default-features = false }
autors-a2l = { version = "0.1.0", path = "crates/autors-a2l" }
autors-formula = { version = "0.1.0", path = "crates/autors-formula" }
autors-values = { version = "0.1.0", path = "crates/autors-values" }
autors-cdf = { version = "0.1.0", path = "crates/autors-cdf" }
autors-dcm = { version = "0.1.0", path = "crates/autors-dcm" }
autors-datafile = { version = "0.1.0", path = "crates/autors-datafile" }
autors-dbc = { version = "0.1.0", path = "crates/autors-dbc" }
autors-ldf = { version = "0.1.0", path = "crates/autors-ldf" }
autors-asc = { version = "0.1.0", path = "crates/autors-asc" }
autors-blf = { version = "0.1.0", path = "crates/autors-blf" }
autors-ltrc = { version = "0.1.0", path = "crates/autors-ltrc" }
autors-isotp = { version = "0.1.0", path = "crates/autors-isotp", default-features = false }
autors-odx = { version = "0.1.0", path = "crates/autors-odx" }
autors-prm = { version = "0.1.0", path = "crates/autors-prm", default-features = false }
autors-diag = { version = "0.1.0", path = "crates/autors-diag", default-features = false }
autors-mdf = { version = "0.1.0", path = "crates/autors-mdf" }
autors-symbols = { version = "0.1.0", path = "crates/autors-symbols" }
autors-elf = { version = "0.1.0", path = "crates/autors-elf" }
autors-map = { version = "0.1.0", path = "crates/autors-map" }
autors-comm = { version = "0.1.0", path = "crates/autors-comm", default-features = false }
autors-ccp = { version = "0.1.0", path = "crates/autors-ccp", default-features = false }
autors-xcp = { version = "0.1.0", path = "crates/autors-xcp", default-features = false }
autors-lin = { version = "0.1.0", path = "crates/autors-lin", default-features = false }
autors-can = { version = "0.1.0", path = "crates/autors-can", default-features = false }
autors-scheduler = { version = "0.1.0", path = "crates/autors-scheduler", default-features = false }
autors-cli = { version = "0.1.0", path = "crates/autors-cli" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
quick-xml = { version = "0.36", features = ["serialize"] }
indexmap = { version = "2" }
byteorder = "1"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"
libloading = "0.8"
socketcan = "3"
serialport = { version = "4", default-features = false }
cbindgen = "0.28"
cc = "1"
async-trait = "0.1"
tokio = { version = "1", default-features = false }
pcap-parser = "0.17"
etherparse = "0.21"
