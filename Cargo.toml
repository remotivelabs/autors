[workspace]
resolver = "2"
members = [
    "crates/autors-util",
    "crates/autors-native",
    "crates/autors-runtime",
    "crates/autors-a2l",
    "crates/autors-cdf",
    "crates/autors-dbc",
    "crates/autors-ldf",
    "crates/autors-odx",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "proprietary"
publish = false

[workspace.dependencies]
autors-util = { path = "crates/autors-util" }
autors-native = { path = "crates/autors-native" }
autors-runtime = { path = "crates/autors-runtime", default-features = false }
autors-a2l = { path = "crates/autors-a2l" }
autors-cdf = { path = "crates/autors-cdf" }
autors-dbc = { path = "crates/autors-dbc" }
autors-ldf = { path = "crates/autors-ldf" }
autors-odx = { path = "crates/autors-odx" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
quick-xml = { version = "0.36", features = ["serialize"] }
indexmap = { version = "2" }
byteorder = "1"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"
libloading = "0.8"
socketcan = "3"
serialport = { version = "4", default-features = false }
cbindgen = "0.28"
cc = "1"
async-trait = "0.1"
tokio = { version = "1", default-features = false }
pcap-parser = "0.17"
etherparse = "0.21"

