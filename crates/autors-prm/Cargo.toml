[package]
name = "autors-prm"
description = "Parser and executor for INCA ProF-style PRM/CNF ECU flash scripts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["runtime-tokio", "blocking"]
runtime-tokio = ["autors-runtime/runtime-tokio"]
blocking = ["autors-runtime/blocking"]

[dependencies]
thiserror.workspace = true
indexmap.workspace = true
autors-datafile.workspace = true
autors-diag.workspace = true
autors-ccp.workspace = true
autors-xcp.workspace = true
autors-can.workspace = true
autors-formula.workspace = true
autors-util.workspace = true
autors-runtime.workspace = true
async-trait.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
