[package]
name = "autors-lin"
description = "LIN bus support: frame types, configuration, checksums, and a logging frame queue"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["runtime-tokio", "blocking"]
runtime-tokio = ["autors-runtime/runtime-tokio"]
blocking = ["autors-runtime/blocking"]
# Vendor adapters: all disabled by default, enabled on demand; `all-vendors` enables all three at once.
all-vendors = ["vendor-kvaser", "vendor-peak", "vendor-vector"]
vendor-kvaser = ["dep:libloading"]
vendor-peak = ["dep:libloading"]
vendor-vector = ["dep:libloading"]

[dependencies]
autors-native.workspace = true
autors-runtime.workspace = true
async-trait.workspace = true
thiserror.workspace = true
libloading = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
