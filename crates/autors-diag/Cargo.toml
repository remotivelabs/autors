[package]
name = "autors-diag"
description = "UDS/KWP2000/DoIP diagnostic protocols (session/message layer) with async core and blocking facade"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["runtime-tokio", "blocking"]
runtime-tokio = ["autors-runtime/runtime-tokio"]
blocking = ["autors-runtime/blocking"]

[dependencies]
autors-a2l.workspace = true
autors-can.workspace = true
autors-isotp.workspace = true
autors-lin.workspace = true
autors-runtime.workspace = true
autors-util.workspace = true
async-trait.workspace = true
thiserror.workspace = true
indexmap.workspace = true
pcap-parser.workspace = true
etherparse.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
