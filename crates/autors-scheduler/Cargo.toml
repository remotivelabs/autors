[package]
name = "autors-scheduler"
description = "Cooperative CAN and LIN remaining-bus schedulers driven by DBC and LDF descriptions"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["runtime-tokio", "blocking"]
runtime-tokio = [
    "autors-runtime/runtime-tokio",
    "autors-can/runtime-tokio",
    "autors-lin/runtime-tokio",
]
blocking = ["autors-runtime/blocking"]

[dependencies]
autors-runtime.workspace = true
autors-can.workspace = true
autors-lin.workspace = true
autors-dbc.workspace = true
autors-ldf.workspace = true
thiserror.workspace = true

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
