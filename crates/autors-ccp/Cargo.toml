[package]
name = "autors-ccp"
description = "CCP (CAN Calibration Protocol) master and A2L IF_DATA CCP block parser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["runtime-tokio", "blocking"]
runtime-tokio = ["autors-runtime/runtime-tokio"]
blocking = ["autors-runtime/blocking"]

[dependencies]
autors-comm.workspace = true
autors-xcp.workspace = true
autors-a2l.workspace = true
autors-can.workspace = true
autors-runtime.workspace = true
async-trait.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
