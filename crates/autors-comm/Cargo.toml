[package]
name = "autors-comm"
description = "Shared communication primitives for protocol masters and DAQ"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["runtime-tokio", "blocking"]
runtime-tokio = ["autors-runtime/runtime-tokio"]
blocking = ["autors-runtime/blocking"]

[dependencies]
autors-util.workspace = true
autors-native.workspace = true
autors-a2l.workspace = true
autors-can.workspace = true
autors-runtime.workspace = true
async-trait.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[[bench]]
name = "daq_configuration"
harness = false
