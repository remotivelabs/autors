[package]
name = "examplecar-flow"
description = "Public configuration-driven UDS security flashing flow plugin example"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "examplecar_flow"
crate-type = ["cdylib", "rlib"]

[dependencies]
autors-security-flasher-sdk = { path = "../../security-flasher-sdk" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"

